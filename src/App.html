<script>
function constructionApp() {
  const roleUsers = {GIAM_DOC:'Nguyễn Văn An',CHT:'Trần Minh Đức',KY_THUAT:'Lê Hoàng Nam',KE_TOAN:'Phạm Thu Hà'};
  return {
    route:'/dashboard', role:localStorage.getItem('demoRole')||'GIAM_DOC', companyName:'Quản lý Công trình', bootstrap:{projects:[],workItems:[]}, loading:false, pending:0, saving:false, moreOpen:false,
    dashboard:null, projects:[], projectDetail:null, projectTab:'progress', charts:{}, toast:{show:false,message:'',type:'success'}, dialog:{show:false,title:'',message:'',input:false,value:'',resolve:null},
    projectFilter:{q:'',trangThai:''}, roleOptions:[{value:'GIAM_DOC',label:'Giám đốc'},{value:'CHT',label:'Chỉ huy trưởng'},{value:'KY_THUAT',label:'Kỹ thuật / Giám sát'},{value:'KE_TOAN',label:'Kế toán'}],
    navigation:[{hash:'#/dashboard',route:'/dashboard',icon:'▦',label:'Tổng quan',permission:'view'},{hash:'#/projects',route:'/projects',icon:'▤',label:'Công trình',permission:'view'},{hash:'#/report/new',route:'/report',icon:'＋',label:'Báo cáo ngày',permission:'report.create'},{hash:'#/approvals',route:'/approvals',icon:'✓',label:'Duyệt báo cáo',permission:'report.review'},{hash:'#/costs',route:'/costs',icon:'₫',label:'Chi phí',permission:'money.view'},{hash:'#/budget',route:'/budget',icon:'⇧',label:'Dự toán',permission:'budget.import'},{hash:'#/catalog',route:'/catalog',icon:'⚙',label:'Danh mục',permission:'catalog.manage'}],
    weatherOptions:[{value:'NANG',label:'☀ Nắng'},{value:'MUA',label:'🌦 Mưa'},{value:'AM_U',label:'☁ Âm u'},{value:'MUA_LON',label:'🌧 Mưa lớn'}],
    today:'', reportForm:{}, photos:[],photoPreviews:[],myReports:[], approvals:[],selectedReports:[],approvalProject:'', costs:{rows:[],total:0},costFilter:{congTrinhId:'',loai:'',tuNgay:'',denNgay:''},costForm:{},
    budgetProject:'',budgetText:'',budgetPreview:null,budgetMode:'APPEND',catalogTab:'projects',catalogProjects:[],catalogItems:[],catalogProjectId:'',projectForm:{},workItemForm:{},
    get userName(){return roleUsers[this.role]}, get roleLabel(){return this.roleOptions.find(r=>r.value===this.role)?.label||''}, get activeProjects(){return (this.bootstrap.projects||[]).filter(p=>p.trangThai==='DANG_THI_CONG')},
    can(permission){const map={view:['GIAM_DOC','CHT','KY_THUAT','KE_TOAN'],'money.view':['GIAM_DOC','CHT','KE_TOAN'],'report.create':['CHT','KY_THUAT'],'report.review':['GIAM_DOC','CHT'],'cost.create':['KE_TOAN'],'budget.import':['GIAM_DOC','KE_TOAN'],'catalog.manage':['GIAM_DOC','CHT'],'demo.reset':['GIAM_DOC']};return (map[permission]||[]).includes(this.role)},
    async init(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce((m,p)=>(m[p.type]=p.value,m),{});this.today=`${parts.year}-${parts.month}-${parts.day}`;this.resetReportForm();this.resetCostForm();this.resetProjectForm();this.resetWorkItemForm();await this.loadBootstrap();await this.onRoute()},
    async api(name,...args){this.pending++;this.loading=true;try{return await new Promise((resolve,reject)=>{let runner=google.script.run.withSuccessHandler(result=>result&&result.ok?resolve(result.data):reject(new Error(result?.error||'Máy chủ không phản hồi.'))).withFailureHandler(error=>reject(new Error(error?.message||String(error))));runner[name]({role:this.role,userName:this.userName},...args)})}finally{this.pending--;this.loading=this.pending>0}},
    async safe(work){try{return await work()}catch(error){this.notify(error.message||String(error),'error');return null}},
    async loadBootstrap(){const data=await this.safe(()=>this.api('api_getBootstrap'));if(data){this.bootstrap=data;this.companyName=data.companyName||this.companyName}},
    async changeRole(){localStorage.setItem('demoRole',this.role);this.destroyCharts();await this.loadBootstrap();this.notify('Đã chuyển sang vai trò '+this.roleLabel);await this.onRoute()},
    async onRoute(){this.moreOpen=false;this.route=(location.hash.replace(/^#/,'')||'/dashboard').split('?')[0];if(!this.allowedRoute()){location.hash='#/dashboard';return}if(this.route==='/dashboard')await this.loadDashboard();else if(this.route==='/projects')await this.loadProjects();else if(this.route.startsWith('/project/'))await this.loadProjectDetail(this.route.split('/')[2]);else if(this.route.startsWith('/report/'))await this.loadMyReports();else if(this.route==='/approvals')await this.loadApprovals();else if(this.route==='/costs')await this.loadCosts();else if(this.route==='/catalog')await this.loadCatalog()},
    allowedRoute(){if(this.route.startsWith('/report/'))return this.can('report.create');if(this.route==='/approvals')return this.can('report.review');if(this.route==='/budget')return this.can('budget.import');if(this.route==='/catalog')return this.can('catalog.manage');if(this.route==='/costs')return this.can('money.view')||this.can('cost.create');return true},
    go(path){location.hash='#'+path},notify(message,type='success'){this.toast={show:true,message,type};clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>this.toast.show=false,3500)},
    ask(title,message,input=false){return new Promise(resolve=>{this.dialog={show:true,title,message,input,value:'',resolve}})},closeDialog(ok){const d=this.dialog;this.dialog.show=false;if(d.resolve)d.resolve(ok?(d.input?d.value:true):false)},
    formatNumber(value){if(value===null||value===undefined||Number.isNaN(Number(value)))return '—';return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:2}).format(Number(value))},formatMoney(value){return value===null||value===undefined?'—':new Intl.NumberFormat('vi-VN').format(Math.round(value))+' ₫'},
    formatCompact(value){value=Number(value||0);if(value>=1e9)return this.formatNumber(value/1e9)+' tỷ';if(value>=1e6)return this.formatNumber(value/1e6)+' tr';return this.formatMoney(value)},
    destroyCharts(){Object.values(this.charts).forEach(c=>c&&c.destroy());this.charts={}},makeChart(id,config){const el=document.getElementById(id);if(!el)return;if(this.charts[id])this.charts[id].destroy();config.options={...(config.options||{}),animation:false};this.charts[id]=new Chart(el,config)},
    async loadDashboard(){const data=await this.safe(()=>this.api('api_getDashboard'));if(!data)return;this.dashboard=data;this.$nextTick(()=>this.renderDashboardCharts())},
    renderDashboardCharts(){const rows=this.dashboard?.progressChart||[];this.makeChart('progressChart',{type:'bar',data:{labels:rows.map(x=>x.ten),datasets:[{label:'Kế hoạch',data:rows.map(x=>x.keHoach),backgroundColor:'#9aacb4'},{label:'Thực tế',data:rows.map(x=>x.thucTe),backgroundColor:'#e97817'}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',scales:{x:{max:100}}}});if(this.can('money.view')){const costs=this.dashboard?.costChart||[];this.makeChart('costChart',{type:'bar',data:{labels:costs.map(x=>x.ten),datasets:[{label:'Dự toán',data:costs.map(x=>x.duToan),backgroundColor:'#9aacb4'},{label:'Thực chi',data:costs.map(x=>x.thucChi),backgroundColor:'#e97817'}]},options:{responsive:true,maintainAspectRatio:false}})}},
    async loadProjects(){const data=await this.safe(()=>this.api('api_listProjects',this.projectFilter));if(data)this.projects=data},
    async loadProjectDetail(id){const data=await this.safe(()=>this.api('api_getProjectDetail',id));if(!data)return;this.projectDetail=data;this.projectTab='progress';this.$nextTick(()=>this.renderCurve())},
    renderCurve(){const rows=this.projectDetail?.progressCurve||[];this.makeChart('curveChart',{type:'line',data:{labels:rows.map(x=>x.ngay),datasets:[{label:'Kế hoạch',data:rows.map(x=>x.keHoach),borderColor:'#7c909a',borderDash:[6,4]},{label:'Thực tế',data:rows.map(x=>x.thucTe),borderColor:'#e97817',spanGaps:false}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:100}}}})},
    renderDetailChart(){this.$nextTick(()=>{const b=this.projectDetail?.costBreakdown||{};const keys=['VAT_LIEU','NHAN_CONG','MAY','KHAC'];this.makeChart('breakdownChart',{type:'doughnut',data:{labels:['Vật liệu','Nhân công','Máy','Khác'],datasets:[{data:keys.map(k=>b[k]?.thucChi||0),backgroundColor:['#e97817','#2f718f','#769e57','#9b6c9d']}]},options:{responsive:true,maintainAspectRatio:false}})})},
    remainingDays(p){if(!p)return 0;return Math.ceil((new Date(p.ngayHoanThanh+'T12:00:00')-new Date(this.today+'T12:00:00'))/86400000)},remainingDaysLabel(p){return this.remainingDays(p)>=0?'Còn lại':'Đã quá hạn'},workItemName(id){return this.projectDetail?.workItems.find(x=>x.id===id)?.ten||id},filteredWorkItems(projectId){return (this.bootstrap.workItems||[]).filter(x=>x.congTrinhId===projectId)},
    reportStatus(v){return {CHO_DUYET:'Chờ duyệt',DA_DUYET:'Đã duyệt',TRA_LAI:'Trả lại'}[v]||v},weatherLabel(v){return this.weatherOptions.find(x=>x.value===v)?.label||v},costTypeLabel(v){return {VAT_LIEU:'Vật liệu',NHAN_CONG:'Nhân công',MAY:'Máy',KHAC:'Khác'}[v]||v},
    resetReportForm(keep=false){const old=this.reportForm||{};this.reportForm={id:'',ngay:keep?(old.ngay||this.today):this.today,congTrinhId:keep?(old.congTrinhId||''):'',hangMucId:'',klThucHien:0,soNhanCong:0,mayMoc:'',thoiTiet:'NANG',vuongMac:''};this.photos=[];this.photoPreviews=[]},
    reportOverrun(){const h=this.filteredWorkItems(this.reportForm.congTrinhId).find(x=>x.id===this.reportForm.hangMucId);return h&&Number(h.klLuyKe)+Number(this.reportForm.klThucHien||0)>Number(h.klKeHoach)*1.1},
    async loadMyReports(){const rows=await this.safe(()=>this.api('api_listReports',{nguoiBaoCao:this.userName}));if(rows)this.myReports=rows},editReport(r){this.reportForm={id:r.id,ngay:r.ngay,congTrinhId:r.congTrinhId,hangMucId:r.hangMucId,klThucHien:r.klThucHien,soNhanCong:r.soNhanCong,mayMoc:r.mayMoc,thoiTiet:r.thoiTiet,vuongMac:r.vuongMac};window.scrollTo({top:0,behavior:'smooth'})},
    async selectPhotos(event){const files=[...event.target.files].slice(0,5-this.photos.length);for(const file of files){try{const photo=await this.compressPhoto(file);this.photos.push(photo);this.photoPreviews.push('data:image/jpeg;base64,'+photo.base64)}catch(error){this.notify(error.message,'error')}}event.target.value=''},
    compressPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Không đọc được ảnh.'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Ảnh không hợp lệ.'));img.onload=()=>{const scale=Math.min(1,1600/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.8),base64=data.split(',')[1];if(base64.length*.75>=1.5*1024*1024){reject(new Error('Ảnh sau khi nén vẫn vượt quá 1,5 MB.'));return}resolve({name:file.name,mimeType:'image/jpeg',base64})};img.src=reader.result};reader.readAsDataURL(file)})},removePhoto(i){this.photos.splice(i,1);this.photoPreviews.splice(i,1)},
    async saveReport(){this.saving=true;const saved=await this.safe(()=>this.api('api_saveReport',this.reportForm,this.photos));this.saving=false;if(saved){this.notify('Đã gửi báo cáo chờ duyệt.');this.resetReportForm(true);await this.loadBootstrap();await this.loadMyReports()}},
    async loadApprovals(){const rows=await this.safe(()=>this.api('api_listReports',{congTrinhId:this.approvalProject,trangThai:'CHO_DUYET'}));if(rows){this.approvals=rows;this.selectedReports=[]}},async reviewReport(id,action,note=''){const row=await this.safe(()=>this.api('api_reviewReport',id,action,note));if(row){this.notify(action==='APPROVE'?'Đã duyệt báo cáo.':'Đã trả lại báo cáo.');await this.loadApprovals()}},
    async returnReport(id){const note=await this.ask('Trả lại báo cáo','Nhập lý do để người báo cáo bổ sung.',true);if(note)await this.reviewReport(id,'RETURN',note)},async approveSelected(){if(!await this.ask('Duyệt hàng loạt','Duyệt '+this.selectedReports.length+' báo cáo đã chọn?'))return;for(const id of this.selectedReports){const ok=await this.safe(()=>this.api('api_reviewReport',id,'APPROVE',''));if(!ok)break}this.notify('Đã xử lý các báo cáo được chọn.');await this.loadApprovals()},
    resetCostForm(){this.costForm={ngay:this.today,congTrinhId:'',hangMucId:'',loai:'VAT_LIEU',noiDung:'',soTien:0,nhaCungCap:'',soChungTu:''}},formatCostInput(event){const digits=event.target.value.replace(/\D/g,'');this.costForm.soTien=Number(digits||0);event.target.value=digits?new Intl.NumberFormat('vi-VN').format(this.costForm.soTien):''},async saveCost(){this.saving=true;const row=await this.safe(()=>this.api('api_saveCost',this.costForm));this.saving=false;if(row){this.notify('Đã lưu chi phí.');const project=this.costForm.congTrinhId;this.resetCostForm();this.costForm.congTrinhId=project;await this.loadCosts()}},async loadCosts(){if(!this.can('money.view'))return;const data=await this.safe(()=>this.api('api_listCosts',this.costFilter));if(data)this.costs=data},
    pasteBudgetSample(){this.budgetText='Mã hạng mục\tMã hiệu\tNội dung\tĐơn vị\tKhối lượng\tĐG Vật liệu\tĐG Nhân công\tĐG Máy\n1\tAF.11213\tBê tông thử nghiệm\tm3\t12,5\t1.250.000\t250.000\t80.000\nSAI\tAB.00000\tDòng sai mã\tm3\t10\t500.000\t100.000\t50.000'},async previewBudget(){if(!this.budgetProject){this.notify('Vui lòng chọn công trình.','error');return}const data=await this.safe(()=>this.api('api_previewBudgetImport',this.budgetProject,this.budgetText));if(data)this.budgetPreview=data},async commitBudget(){const rows=(this.budgetPreview?.rows||[]).filter(x=>x.valid);if(this.budgetMode==='REPLACE'&&!await this.ask('Thay thế dự toán','Toàn bộ dự toán cũ của công trình sẽ bị xoá.'))return;const data=await this.safe(()=>this.api('api_commitBudgetImport',this.budgetProject,rows,this.budgetMode));if(data){this.notify('Đã nhập '+data.length+' dòng dự toán.');this.budgetPreview=null;await this.loadBootstrap()}},
    async loadCatalog(){const list=await this.safe(()=>this.api('api_listProjects',{}));if(list)this.catalogProjects=list;this.catalogItems=this.bootstrap.workItems||[]},resetProjectForm(){this.projectForm={id:'',ten:'',chuDauTu:'',diaDiem:'',ngayKhoiCong:this.today,ngayHoanThanh:this.today,giaTriHopDong:0,chiHuyTruong:'',trangThai:'CHUAN_BI'}},editProject(p){this.projectForm={...p}},async saveProject(){const row=await this.safe(()=>this.api('api_saveProject',this.projectForm));if(row){this.notify('Đã lưu công trình.');this.resetProjectForm();await this.loadBootstrap();await this.loadCatalog()}},async deleteProject(p){if(!await this.ask('Xoá công trình','Xoá công trình “'+p.ten+'”?'))return;const ok=await this.safe(()=>this.api('api_deleteProject',p.id));if(ok){this.notify('Đã xoá công trình.');await this.loadBootstrap();await this.loadCatalog()}},
    resetWorkItemForm(){this.workItemForm={id:'',congTrinhId:'',stt:1,ten:'',donVi:'',klKeHoach:1,ngayBatDau:this.today,ngayKetThuc:this.today}},editWorkItem(h){this.workItemForm={...h}},async saveWorkItem(){const row=await this.safe(()=>this.api('api_saveWorkItem',this.workItemForm));if(row){this.notify('Đã lưu hạng mục.');this.resetWorkItemForm();await this.loadBootstrap();await this.loadCatalog()}},async deleteWorkItem(h){if(!await this.ask('Xoá hạng mục','Xoá hạng mục “'+h.ten+'”?'))return;const ok=await this.safe(()=>this.api('api_deleteWorkItem',h.id));if(ok){this.notify('Đã xoá hạng mục.');await this.loadBootstrap();await this.loadCatalog()}},async resetDemo(){if(!await this.ask('Tạo lại dữ liệu mẫu','Toàn bộ dữ liệu hiện tại sẽ được thay bằng dữ liệu demo.'))return;const result=await this.safe(()=>this.api('api_resetDemo'));if(result){this.notify('Đã tạo lại dữ liệu mẫu.');await this.loadBootstrap();await this.loadCatalog()}}
  };
}
</script>
