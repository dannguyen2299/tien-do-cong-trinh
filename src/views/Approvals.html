<section x-show="route==='/approvals' && can('report.review')">
  <div class="page-header"><div><h1>Duyệt báo cáo</h1><p>Các báo cáo đang chờ duyệt</p></div><button class="btn" :disabled="!selectedReports.length" @click="approveSelected()">Duyệt đã chọn</button></div>
  <div class="filters"><select x-model="approvalProject" @change="loadApprovals()"><option value="">Tất cả công trình</option><template x-for="p in bootstrap.projects||[]" :key="p.id"><option :value="p.id" x-text="p.ten"></option></template></select></div>
  <template x-for="r in approvals" :key="r.id"><article class="report-card"><div class="attention"><div><input type="checkbox" :value="r.id" x-model="selectedReports"> <strong x-text="r.ngay+' · '+r.congTrinhTen"></strong><small class="meta" x-text="r.hangMucTen"></small></div><span class="badge yellow">Chờ duyệt</span></div><p><strong x-text="formatNumber(r.klThucHien)+' '+r.donVi"></strong> · <span x-text="r.soNhanCong+' nhân công · '+weatherLabel(r.thoiTiet)"></span></p><p x-text="r.vuongMac||'Không có vướng mắc'"></p><div class="photo-grid"><template x-for="url in r.photoUrls||[]" :key="url"><a :href="url" target="_blank"><img :src="url" alt="Ảnh hiện trường"></a></template></div><div class="review-actions"><button class="btn" @click="reviewReport(r.id,'APPROVE')">Duyệt</button><button class="btn danger" @click="returnReport(r.id)">Trả lại</button></div></article></template><div class="empty" x-show="!approvals.length">Không có báo cáo chờ duyệt.</div>
</section>
