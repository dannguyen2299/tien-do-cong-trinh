<section x-show="route==='/budget' && can('budget.import')">
  <div class="page-header"><div><h1>Import dự toán</h1><p>Dán dữ liệu từ Excel để xem trước và nhập</p></div></div>
  <div class="card"><div class="field"><label>Công trình</label><select x-model="budgetProject"><option value="">Chọn công trình</option><template x-for="p in bootstrap.projects||[]" :key="p.id"><option :value="p.id" x-text="p.ten"></option></template></select></div><div class="field"><label>Dữ liệu TSV</label><small class="hint">Mã hạng mục · Mã hiệu · Nội dung · Đơn vị · Khối lượng · ĐG Vật liệu · ĐG Nhân công · ĐG Máy</small><textarea class="import-area" x-model="budgetText"></textarea></div><div class="actions"><button class="btn ghost" @click="pasteBudgetSample()">Dán dữ liệu mẫu</button><button class="btn" @click="previewBudget()">Xem trước</button></div></div>
  <div class="card" x-show="budgetPreview"><div class="attention"><strong x-text="`${budgetPreview?.validCount||0} dòng hợp lệ · ${budgetPreview?.errorCount||0} dòng lỗi`"></strong><strong x-text="formatMoney(budgetPreview?.total)"></strong></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Dòng</th><th>Hạng mục</th><th>Mã hiệu</th><th>Nội dung</th><th class="num">Khối lượng</th><th class="num">Thành tiền</th><th>Lỗi</th></tr></thead><tbody><template x-for="r in budgetPreview?.rows||[]" :key="r.line"><tr :class="{'error-row':!r.valid}"><td x-text="r.line"></td><td x-text="r.hangMucTen||r.hangMucId"></td><td x-text="r.maHieu"></td><td x-text="r.noiDung"></td><td class="num" x-text="formatNumber(r.khoiLuong)"></td><td class="num" x-text="formatMoney(r.thanhTien)"></td><td class="error-text" x-text="r.errors.join(' ')"></td></tr></template></tbody></table></div><div class="actions"><select x-model="budgetMode"><option value="APPEND">Thêm vào</option><option value="REPLACE">Thay thế dự toán cũ</option></select><button class="btn" :disabled="!budgetPreview?.validCount" @click="commitBudget()">Nhập dự toán</button></div></div>
</section>
