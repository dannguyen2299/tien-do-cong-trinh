<section x-show="route==='/catalog' && can('catalog.manage')">
  <div class="page-header"><div><h1>Danh mục</h1><p>Quản lý công trình và hạng mục</p></div><button class="btn danger" x-show="can('demo.reset')" @click="resetDemo()">Tạo lại dữ liệu mẫu</button></div>
  <div class="tabs"><button :class="{active:catalogTab==='projects'}" @click="catalogTab='projects'">Công trình</button><button :class="{active:catalogTab==='items'}" @click="catalogTab='items'">Hạng mục</button></div>
  <div x-show="catalogTab==='projects'" class="grid-2"><form class="card" @submit.prevent="saveProject()"><h2 x-text="projectForm.id?'Sửa công trình':'Thêm công trình'"></h2><div class="form-grid"><div class="field full"><label>Tên</label><input required x-model="projectForm.ten"></div><div class="field"><label>Chủ đầu tư</label><input x-model="projectForm.chuDauTu"></div><div class="field"><label>Địa điểm</label><input x-model="projectForm.diaDiem"></div><div class="field"><label>Khởi công</label><input type="date" required x-model="projectForm.ngayKhoiCong"></div><div class="field"><label>Hoàn thành</label><input type="date" required x-model="projectForm.ngayHoanThanh"></div><div class="field"><label>Giá trị hợp đồng</label><input type="number" min="0" x-model.number="projectForm.giaTriHopDong"></div><div class="field"><label>Chỉ huy trưởng</label><input x-model="projectForm.chiHuyTruong"></div><div class="field"><label>Trạng thái</label><select x-model="projectForm.trangThai"><option value="CHUAN_BI">Chuẩn bị</option><option value="DANG_THI_CONG">Đang thi công</option><option value="TAM_DUNG">Tạm dừng</option><option value="HOAN_THANH">Hoàn thành</option></select></div></div><div class="actions"><button type="button" class="btn ghost" @click="resetProjectForm()">Mới</button><button class="btn">Lưu</button></div></form><div class="card"><template x-for="p in catalogProjects" :key="p.id"><div class="attention"><div><strong x-text="p.ten"></strong><small class="meta" x-text="p.diaDiem"></small></div><div><button class="btn ghost" @click="editProject(p)">Sửa</button> <button class="btn danger" @click="deleteProject(p)">Xoá</button></div></div></template></div></div>
  <div x-show="catalogTab==='items'" class="grid-2"><form class="card" @submit.prevent="saveWorkItem()"><h2 x-text="workItemForm.id?'Sửa hạng mục':'Thêm hạng mục'"></h2><div class="form-grid"><div class="field full"><label>Công trình</label><select required x-model="workItemForm.congTrinhId"><option value="">Chọn công trình</option><template x-for="p in catalogProjects" :key="p.id"><option :value="p.id" x-text="p.ten"></option></template></select></div><div class="field"><label>STT</label><input type="number" min="1" required x-model.number="workItemForm.stt"></div><div class="field"><label>Tên</label><input required x-model="workItemForm.ten"></div><div class="field"><label>Đơn vị</label><input x-model="workItemForm.donVi"></div><div class="field"><label>KL kế hoạch</label><input type="number" min="0.01" step="0.01" required x-model.number="workItemForm.klKeHoach"></div><div class="field"><label>Bắt đầu</label><input type="date" required x-model="workItemForm.ngayBatDau"></div><div class="field"><label>Kết thúc</label><input type="date" required x-model="workItemForm.ngayKetThuc"></div></div><div class="actions"><button type="button" class="btn ghost" @click="resetWorkItemForm()">Mới</button><button class="btn">Lưu</button></div></form><div class="card"><div class="field"><label>Lọc theo công trình</label><select x-model="catalogProjectId"><option value="">Tất cả</option><template x-for="p in catalogProjects" :key="p.id"><option :value="p.id" x-text="p.ten"></option></template></select></div><template x-for="h in catalogItems.filter(i=>!catalogProjectId||i.congTrinhId===catalogProjectId)" :key="h.id"><div class="attention"><div><strong x-text="h.stt+'. '+h.ten"></strong><small class="meta" x-text="h.donVi+' · '+formatNumber(h.klKeHoach)"></small></div><div><button class="btn ghost" @click="editWorkItem(h)">Sửa</button> <button class="btn danger" @click="deleteWorkItem(h)">Xoá</button></div></div></template></div></div>
</section>
