<section x-show="route==='/costs' && (can('cost.create')||can('money.view'))">
  <div class="page-header"><div><h1>Chi phí thực tế</h1><p>Nhập và tra cứu chi phí công trình</p></div></div>
  <form class="card" x-show="can('cost.create')" @submit.prevent="saveCost()"><div class="form-grid"><div class="field"><label>Ngày</label><input type="date" required :max="today" x-model="costForm.ngay"></div><div class="field"><label>Công trình</label><select required x-model="costForm.congTrinhId" @change="costForm.hangMucId=''"><option value="">Chọn công trình</option><template x-for="p in bootstrap.projects||[]" :key="p.id"><option :value="p.id" x-text="p.ten"></option></template></select></div><div class="field"><label>Hạng mục</label><select required x-model="costForm.hangMucId"><option value="">Chọn hạng mục</option><template x-for="h in filteredWorkItems(costForm.congTrinhId)" :key="h.id"><option :value="h.id" x-text="h.ten"></option></template></select></div><div class="field"><label>Loại</label><select x-model="costForm.loai"><option value="VAT_LIEU">Vật liệu</option><option value="NHAN_CONG">Nhân công</option><option value="MAY">Máy</option><option value="KHAC">Khác</option></select></div><div class="field full"><label>Nội dung</label><input required x-model="costForm.noiDung"></div><div class="field"><label>Số tiền (VNĐ)</label><input type="text" inputmode="numeric" required :value="costForm.soTien?new Intl.NumberFormat('vi-VN').format(costForm.soTien):''" @input="formatCostInput($event)"></div><div class="field"><label>Nhà cung cấp</label><input x-model="costForm.nhaCungCap"></div><div class="field"><label>Số chứng từ</label><input x-model="costForm.soChungTu"></div></div><button class="btn" :disabled="saving">Lưu chi phí</button></form>
  <div class="card" x-show="can('money.view')"><div class="filters"><select x-model="costFilter.congTrinhId" @change="loadCosts()"><option value="">Tất cả công trình</option><template x-for="p in bootstrap.projects||[]" :key="p.id"><option :value="p.id" x-text="p.ten"></option></template></select><select x-model="costFilter.loai" @change="loadCosts()"><option value="">Tất cả loại</option><option value="VAT_LIEU">Vật liệu</option><option value="NHAN_CONG">Nhân công</option><option value="MAY">Máy</option><option value="KHAC">Khác</option></select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Ngày</th><th>Công trình</th><th>Hạng mục</th><th>Loại</th><th>Nội dung</th><th class="num">Số tiền</th></tr></thead><tbody><template x-for="c in costs.rows||[]" :key="c.id"><tr><td x-text="c.ngay"></td><td x-text="c.congTrinhTen"></td><td x-text="c.hangMucTen"></td><td x-text="costTypeLabel(c.loai)"></td><td x-text="c.noiDung"></td><td class="num" x-text="formatMoney(c.soTien)"></td></tr></template></tbody><tfoot><tr><th colspan="5">Tổng</th><th class="num" x-text="formatMoney(costs.total)"></th></tr></tfoot></table></div></div>
</section>
