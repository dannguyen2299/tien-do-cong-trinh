<section x-show="route==='/projects'">
  <div class="page-header"><div><h1>Công trình</h1><p>Danh sách công trình đang quản lý</p></div></div>
  <div class="filters"><input placeholder="Tìm theo tên hoặc địa điểm" x-model.debounce.300ms="projectFilter.q" @input="loadProjects()"><select x-model="projectFilter.trangThai" @change="loadProjects()"><option value="">Tất cả trạng thái</option><option value="CHUAN_BI">Chuẩn bị</option><option value="DANG_THI_CONG">Đang thi công</option><option value="TAM_DUNG">Tạm dừng</option><option value="HOAN_THANH">Hoàn thành</option></select></div>
  <div class="project-cards"><template x-for="p in projects" :key="p.id"><article class="project-card" @click="go('/project/'+p.id)"><h3 x-text="p.ten"></h3><p class="meta" x-text="p.diaDiem"></p><p class="meta" x-text="p.ngayKhoiCong+' → '+p.ngayHoanThanh"></p><div class="progress"><span :style="`width:${p.ptThucTe}%`"></span></div><div class="attention"><strong x-text="formatNumber(p.ptThucTe)+'%'"></strong><span class="badge" :class="p.trangThaiTienDo.color" x-text="p.trangThaiTienDo.label"></span></div></article></template></div><div class="empty" x-show="!projects.length">Không tìm thấy công trình.</div>
</section>
