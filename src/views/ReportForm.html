<section x-show="route.startsWith('/report/') && can('report.create')">
  <div class="page-header"><div><h1 x-text="reportForm.id?'Sửa báo cáo':'Báo cáo ngày'"></h1><p>Ghi nhận khối lượng và tình hình thi công</p></div></div>
  <div class="grid-2"><form class="card" @submit.prevent="saveReport()"><div class="form-grid">
    <div class="field"><label>Ngày</label><input type="date" required :max="today" x-model="reportForm.ngay"></div><div class="field"><label>Công trình</label><select required x-model="reportForm.congTrinhId" @change="reportForm.hangMucId=''"><option value="">Chọn công trình</option><template x-for="p in activeProjects" :key="p.id"><option :value="p.id" x-text="p.ten"></option></template></select></div>
    <div class="field full"><label>Hạng mục</label><select required x-model="reportForm.hangMucId"><option value="">Chọn hạng mục</option><template x-for="h in filteredWorkItems(reportForm.congTrinhId)" :key="h.id"><option :value="h.id" x-text="`${h.ten} · ${h.donVi} · đã làm ${formatNumber(h.klLuyKe)}/${formatNumber(h.klKeHoach)}`"></option></template></select><small class="hint" x-show="reportOverrun()">⚠ Lũy kế sau báo cáo vượt 110% khối lượng kế hoạch.</small></div>
    <div class="field"><label>Khối lượng thực hiện</label><input type="number" min="0" step="0.01" inputmode="decimal" required x-model.number="reportForm.klThucHien"></div><div class="field"><label>Số nhân công</label><input type="number" min="0" step="1" inputmode="numeric" required x-model.number="reportForm.soNhanCong"></div>
    <div class="field full"><label>Máy móc</label><input x-model="reportForm.mayMoc" placeholder="Ví dụ: 1 máy xúc, 1 cẩu"></div><div class="field full"><label>Thời tiết</label><div class="weather"><template x-for="w in weatherOptions" :key="w.value"><button type="button" :class="{active:reportForm.thoiTiet===w.value}" @click="reportForm.thoiTiet=w.value" x-text="w.label"></button></template></div></div>
    <div class="field full"><label>Vướng mắc / ghi chú</label><textarea x-model="reportForm.vuongMac"></textarea></div><div class="field full"><label>Ảnh hiện trường (tối đa 5)</label><input type="file" accept="image/*" capture="environment" multiple @change="selectPhotos($event)"><div class="photo-grid"><template x-for="(p,i) in photoPreviews" :key="i"><div class="photo-preview"><img :src="p"><button type="button" @click="removePhoto(i)">×</button></div></template></div></div>
  </div><button class="btn" type="submit" :disabled="saving" x-text="saving?'Đang gửi…':'Gửi báo cáo'"></button></form>
  <div class="card"><h2>Báo cáo của tôi</h2><template x-for="r in myReports" :key="r.id"><div class="report-card" :class="{returned:r.trangThai==='TRA_LAI'}"><div class="attention"><strong x-text="r.ngay+' · '+r.hangMucTen"></strong><span class="badge muted" x-text="reportStatus(r.trangThai)"></span></div><p x-show="r.ghiChuDuyet" class="error-text" x-text="'Lý do: '+r.ghiChuDuyet"></p><button class="btn ghost" x-show="r.trangThai==='TRA_LAI'" @click="editReport(r)">Sửa và gửi lại</button></div></template><div class="empty" x-show="!myReports.length">Chưa có báo cáo của bạn.</div></div></div>
</section>
